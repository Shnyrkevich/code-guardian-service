server {
  listen 80;
  root /usr/share/nginx/html;

  # The page calls /graphql on its own origin; forward it to the backend container.
  # Docker's DNS resolver plus a variable make nginx re-resolve "app" if that container is recreated.
  location /graphql {
    resolver 127.0.0.11 valid=10s;
    set $api http://app:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
